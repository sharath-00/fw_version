name: Automated BBMP Firmware Version Mail Report

on:
  # Automated Cron Schedule (Runs automatically without manual triggers)
  schedule:
    # Runs everyday at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * *'
    # Runs everyday at 12:30 UTC (06:00 PM IST)
    - cron: '30 12 * * *'
  # Allows optional manual trigger from GitHub Actions tab if needed
  workflow_dispatch:

jobs:
  send-firmware-report:
    name: Generate & Send BBMP Firmware Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Firmware Audit & Dispatch Email
        env:
          THINGSBOARD_HOST: ${{ secrets.THINGSBOARD_HOST || 'https://schnelliot.in/' }}
          THINGSBOARD_USERNAME: ${{ secrets.THINGSBOARD_USERNAME }}
          THINGSBOARD_PASSWORD: ${{ secrets.THINGSBOARD_PASSWORD }}
          BBMP_CUSTOMER_ID: ${{ secrets.BBMP_CUSTOMER_ID || 'e2119df0-45c3-11f0-94dc-77130b2f47e9' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS || 'true' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS || '71762332038@cit.edu.in' }}
          BCC_EMAILS: ${{ secrets.BCC_EMAILS || '' }}
          EMAIL_SUBJECT_PREFIX: ${{ secrets.EMAIL_SUBJECT_PREFIX || '[BBMP Panels - Firmware Version Status Report]' }}
        run: |
          python main.py --send-now
